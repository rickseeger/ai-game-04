name: foundation
on: [push, pull_request]
jobs:
  smoke:
    strategy:
      matrix:
        # Windows delivery is explicitly deferred; do not schedule Windows jobs.
        os: [ubuntu-latest]
        python: ["3.11", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v
      - run: python tools/build.py
      - run: python dist/lantern-survey.pyz --smoke
      - run: python tools/package_linux.py
      - uses: actions/upload-artifact@v4
        with:
          name: foundation-${{ matrix.os }}-${{ matrix.python }}
          path: dist/*
